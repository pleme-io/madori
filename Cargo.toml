[package]
name = "madori"
version = "0.1.13"
edition = "2024"
rust-version = "1.89.0"
description = "Madori (間取り) — GPU application framework for pleme-io apps"
homepage = "https://github.com/pleme-io/madori"
repository = "https://github.com/pleme-io/madori"
documentation = "https://docs.rs/madori"
readme = "README.md"
license = "MIT"
categories = ["gui"]
keywords = ["gpu", "wgpu", "framework", "application", "window"]

[lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dependencies]
# 0.1.11 is a REQUIREMENT, not a preference: `GpuContext::instance()` and
# `new_for_surface()` land there, and they are what let madori pick an adapter
# that can actually present to its surface. Under a bare "0.1" an existing
# Cargo.lock happily stays on 0.1.9 and the build fails on a missing method,
# which is a worse error than the panic this replaced.
garasu = "0.1.11"
egaku = "0.1"
shikumi = "0.1"
# ishou-tokens — the fleet design system. The `wgpu` feature exposes the
# typed `Srgb → Linear → wgpu::Color` path so the framework's themed
# default (the built-in `ClearRenderer`) sources its colour from a fleet
# theme token instead of a hand-authored literal. Matches the GPU-app
# convention (mado, escriba, hibiki, … all depend on it `features = ["wgpu"]`).
ishou-tokens = { version = "0.1", features = ["wgpu"] }
wgpu = "25"
winit = "0.30"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
